
name: Build WhatsApp Reporter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q WhatsAppReporter-Android-Project.zip -d extracted
          test -f extracted/WhatsAppReporter/settings.gradle.kts

      - name: Build APK
        run: |
          cd extracted/WhatsAppReporter
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReporter-APK
          path: extracted/WhatsAppReporter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
                - name: Align Kotlin JVM target
        run: |
          cat >> extracted/WhatsAppReporter/app/build.gradle.kts <<'EOF'
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions.jvmTarget = "1.8"
          }
          EOF
